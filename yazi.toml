[mgr]
ratio = [0, 4, 3]

#Hardcode nvim as editor
[opener]
edit = [
    { run = 'nvim %s',block=true, for="unix"}
]
open = [
	{ run = 'xdg-open %s1', desc = "Open" },
]
exec = [
    { run = 'exec %s', desc = "Exec"}
]
extract = [
	{ run = 'ya pub extract --list %s1', desc = "Extract here", for = "unix" },
	{ run = 'ya pub extract --list %*',   desc = "Extract here", for = "windows" },
]
wine = [
    { run = 'wine $%s1', desc = "Run with wine"}
]
bookokrat = [
    { run = 'bookokrat %s1',block = true, desc = "Open with Bookokrat"}
]
[open]

append_rules = [
    #{ mime = "application/*", use = "exec"},
    #{ mime = "text/shellscript", use = "exec"},
    { mime = "application/microsoft.portable-executable", use = "wine"},
    { mime = "application/pdf", use = "bookokrat"},
    { url = "*", use = "xdg-open"}

]
