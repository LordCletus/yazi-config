#Trash file
[[mgr.prepend_keymap]]
on = [ "d", "d" ]
run = "remove"
desc = "Trash selected file"
#Open diskonaut
[[mgr.prepend_keymap]]
on = [ "d", "u" ]
run = "shell --block diskonaut"
desc = "Launch diskonaut"
#Symlink
[[mgr.prepend_keymap]]
on = [ "s", "l" ]
run = "link --force"
desc = "Symlink to currently yanked file"
#Smart Enter
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"
[[mgr.prepend_keymap]]
on = "L"
run = "open --interactive"
desc = "Open with X"

#Drop to shell
[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

#Start lazygit
[[mgr.prepend_keymap]]
on   = [ "g", "l" ]
run  = "plugin lazygit"
desc = "run lazygit"

#New file
[[mgr.prepend_keymap]]
on = "o"
run = "create"
desc = "Create new file (touch)"

[[mgr.prepend_keymap]]
on = "O"
run = "create --dir"
desc = "Create new dir (mkdir)"

#Make esc work gooder
[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

#Chmod command
[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

#Bunny bookmarks
[[mgr.prepend_keymap]]
desc = "Start bunny.yazi"
on = "b"
run = "plugin bunny"

# Optionally, add another keymap to immediately fuzzy search bookmarks
[[mgr.prepend_keymap]]
desc = "Start bunny.yazi fuzzy search"
on = "B"
run = "plugin bunny fuzzy"

